services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kefay
      POSTGRES_PASSWORD: kefay
      POSTGRES_DB: kefay
    ports:
      - "5432:5432"
    volumes:
      - kefay-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kefay -d kefay"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://kefay:kefay@db:5432/kefay?schema=public"
      JWT_SECRET: "dev-secret-change-in-production"
      JWT_EXPIRES_IN: "1d"
      PORT: 4000
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:4000"
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  kefay-db-data:
